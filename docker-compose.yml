# Legal Document Assistant - Docker Compose
# Complete open source stack for local development

version: "3.9"

services:
  # Legal Document Assistant API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - SQLITE_DATABASE_URL=sqlite+aiosqlite:///./data/legal_docs.db
      - PII_DETECTION_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro  # For development hot reload
    depends_on:
      ollama:
        condition: service_started
      chroma:
        condition: service_healthy
    networks:
      - legal-network
    restart: unless-stopped

  # Ollama - Local LLM (Open Source)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - legal-network
    restart: unless-stopped
    # Pull models on startup
    entrypoint: >
      /bin/sh -c "
        ollama serve &
        sleep 5 &&
        ollama pull llama3.2 &&
        wait
      "

  # ChromaDB - Vector Store (Open Source)
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - legal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - Caching (Open Source, Optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - legal-network
    restart: unless-stopped

networks:
  legal-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local
